
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Morello Seguros - Cotizador</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f9ff;
      padding: 20px;
      color: #003366;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 250px;
    }
    h1 {
      text-align: center;
      color: #0052cc;
    }
    form {
      max-width: 550px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      background: #0052cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #003d99;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <img src="https://raw.githubusercontent.com/openai-chatgpt-resources/images/main/morello-logo.png" alt="Morello Seguros Logo">
  </div>

  <h1>Cotizá tu seguro</h1>
  <form id="cotizador-form" action="https://formspree.io/f/mwkgqlow" method="POST">
    <label for="nombre">Nombre completo</label>
    <input type="text" name="Nombre" required />

    <label for="telefono">Teléfono</label>
    <input type="tel" name="Teléfono" required />

    <label for="email">Email</label>
    <input type="email" name="Email" required />

    <label for="anio">Año del vehículo</label>
    <select name="Año" id="anio" required>
      <option value="">Seleccioná un año</option>
<option value="2010">2010</option>
<option value="2011">2011</option>
<option value="2012">2012</option>
<option value="2013">2013</option>
<option value="2014">2014</option>
<option value="2015">2015</option>
<option value="2016">2016</option>
<option value="2017">2017</option>
<option value="2018">2018</option>
<option value="2019">2019</option>
<option value="2020">2020</option>
<option value="2021">2021</option>
<option value="2022">2022</option>
<option value="2023">2023</option>
<option value="2024">2024</option>
    </select>

    <label for="marca">Marca</label>
    <select name="Marca" id="marca" required disabled>
      <option value="">Seleccioná una marca</option>
    </select>

    <label for="modelo">Modelo / Versión</label>
    <select name="Modelo" id="modelo" required disabled>
      <option value="">Seleccioná un modelo</option>
    </select>

    <button type="submit">Enviar cotización</button>
  </form>

  <script>
    const dataVehiculos = {
      "2015": {
        "Chevrolet": ["Agile LT", "Agile LTZ"],
        "Volkswagen": ["Gol Trendline", "Gol Highline"]
      },
      "2018": {
        "Ford": ["Fiesta S", "Fiesta SE", "Fiesta Titanium"],
        "Renault": ["Sandero Expression", "Sandero Stepway"]
      },
      "2020": {
        "Toyota": ["Corolla XLI", "Corolla SEG"],
        "Fiat": ["Cronos Drive", "Cronos Precision"]
      },
      "2022": {
        "Peugeot": ["208 Active", "208 Feline"],
        "Volkswagen": ["Polo Trendline", "Polo Highline"]
      },
      "2024": {
        "Toyota": ["Hilux DX", "Hilux SRX"],
        "Chevrolet": ["Onix LT", "Onix Premier"]
      }
    };

    const anioSelect = document.getElementById("anio");
    const marcaSelect = document.getElementById("marca");
    const modeloSelect = document.getElementById("modelo");

    anioSelect.addEventListener("change", () => {
      const anio = anioSelect.value;
      marcaSelect.innerHTML = '<option value="">Seleccioná una marca</option>';
      modeloSelect.innerHTML = '<option value="">Seleccioná un modelo</option>';
      modeloSelect.disabled = true;

      if (anio && dataVehiculos[anio]) {
        Object.keys(dataVehiculos[anio]).forEach(marca => {
          const option = document.createElement("option");
          option.value = marca;
          option.textContent = marca;
          marcaSelect.appendChild(option);
        });
        marcaSelect.disabled = false;
      } else {
        marcaSelect.disabled = true;
      }
    });

    marcaSelect.addEventListener("change", () => {
      const anio = anioSelect.value;
      const marca = marcaSelect.value;
      modeloSelect.innerHTML = '<option value="">Seleccioná un modelo</option>';

      if (anio && marca && dataVehiculos[anio][marca]) {
        dataVehiculos[anio][marca].forEach(modelo => {
          const option = document.createElement("option");
          option.value = modelo;
          option.textContent = modelo;
          modeloSelect.appendChild(option);
        });
        modeloSelect.disabled = false;
      } else {
        modeloSelect.disabled = true;
      }
    });
  </script>

</body>
</html>
